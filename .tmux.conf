
# =============================================================================
# tmux — Kanagawa Dragon (matches Kitty)
# =============================================================================

set -s default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Reload with prefix + r
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# Prefix: keep C-a, send a literal C-a with prefix + C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Behaviour
set -g mode-keys vi
set -g mouse on
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g @continuum-restore "on"

# Open new windows and panes in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Copy to the macOS clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# --- Kanagawa Dragon ---------------------------------------------------------
# background          #181616
# foreground          #c5c9c5
# selection           #2D4F67
# cursor              #C8C093
# dark background     #12120f
# muted foreground   #a6a69c
# red                 #c4746e
# green               #8a9a7b
# yellow              #c4b28a
# blue                #8ba4b0
# magenta             #a292a3
# cyan                #8ea4a2
# bright red          #E46876
# bright green        #87a987
# bright yellow       #E6C384
# bright blue         #7FB4CA
# bright magenta      #938AA9
# bright cyan         #7AA89F

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#181616,fg=#c5c9c5"
set -g status-left-length 40
set -g status-right-length 60

# Session indicator
set -g status-left "#[fg=#181616,bg=#8a9a7b,bold] #S #[fg=#8a9a7b,bg=#181616] "

# Right status: prefix indicator, time and hostname
set -g status-right "#[fg=#a6a69c]#{?client_prefix,#[fg=#E6C384,bold]PREFIX ,}#[fg=#a6a69c]%H:%M #[fg=#181616,bg=#8ba4b0]#[fg=#181616,bold] #H "

# Window status
set -g window-status-separator ""
setw -g window-status-style "fg=#a6a69c,bg=#12120f"
setw -g window-status-current-style "fg=#C8C093,bg=#12120f,bold"
setw -g window-status-activity-style "fg=#E6C384,bg=#12120f"
setw -g window-status-bell-style "fg=#E46876,bg=#12120f,bold"

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# Pane borders
set -g pane-border-style "fg=#2a2928"
set -g pane-active-border-style "fg=#8ba4b0"
set -g pane-border-status off

# Messages and command prompt
set -g message-style "bg=#2D4F67,fg=#C8C093"
set -g message-command-style "bg=#2D4F67,fg=#C8C093"

# Copy mode
set -g mode-style "bg=#2D4F67,fg=#C8C093,bold"

# Clock
set -g clock-mode-colour "#C8C093"
set -g clock-mode-style 24

# Pane numbers
set -g display-panes-active-colour "#87a987"
set -g display-panes-colour "#a6a69c"

# --- Plugins -----------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
