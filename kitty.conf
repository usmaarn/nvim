
# =============================================================================
# Kitty — Kanagawa Dragon
# Based on rebelot/kanagawa.nvim
# =============================================================================

# --- Font --------------------------------------------------------------------
font_size 16
font_family JetBrainsMono Nerd Font
bold_font auto

# --- Colors: Kanagawa Dragon -------------------------------------------------
background #181616
foreground #c5c9c5
selection_background #2D4F67
selection_foreground #C8C093
url_color #72A7BC
cursor #C8C093
cursor_text_color #181616

# Tabs
active_tab_background #12120f
active_tab_foreground #C8C093
inactive_tab_background #12120f
inactive_tab_foreground #a6a69c
tab_bar_background #181616

# Normal colors
color0 #0d0c0c
color1 #c4746e
color2 #8a9a7b
color3 #c4b28a
color4 #8ba4b0
color5 #a292a3
color6 #8ea4a2
color7 #C8C093

# Bright colors
color8  #a6a69c
color9  #E46876
color10 #87a987
color11 #E6C384
color12 #7FB4CA
color13 #938AA9
color14 #7AA89F
color15 #c5c9c5

# Extended colors
color16 #b6927b
color17 #b98d7b

# --- General ------------------------------------------------------------------
macos_option_as_alt both

include *.conf

# --- Layout -------------------------------------------------------------------
window_padding_width 8
scrollback_lines 10000
# background_opacity 1
# background_image ~/Pictures/terminal.jpg
# background_tint 0.9
# background_image_layout scaled

# --- Tab bar ------------------------------------------------------------------
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"
active_tab_font_style bold
inactive_tab_font_style normal

# --- Cursor -------------------------------------------------------------------
# cursor_beam_thickness 2
# cursor_blink_interval 0.5 ease-in-out
# cursor_trail 1
# cursor_trail_color #C8C093

# --- Scrolling pager ----------------------------------------------------------
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# --- Tabs ---------------------------------------------------------------------
# Mirror the Ctrl+h / Ctrl+l flow used by Neovim and tmux
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab

# --- Session ------------------------------------------------------------------
restore_session_after_logout true
